# Menjaga proyek Supabase (paket gratis) tetap aktif.
# Supabase menjeda proyek gratis jika aktivitas database rendah selama 7 hari.
# Workflow ini membaca satu baris kategori tiga kali seminggu.
#
# Perlu dua secret di GitHub: Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       contoh: https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  kunci anon / publishable (sama dengan di js/config.js)

name: Jaga Supabase tetap aktif

on:
  schedule:
    - cron: '17 1 * * 1,3,5'   # Senin, Rabu, Jumat pukul 01:17 UTC (09:17 WITA)
  workflow_dispatch:            # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Baca satu baris dari Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secret SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi."; exit 1
          fi
          AUTH=()
          # Kunci lama (anon) berbentuk JWT dan juga dikirim sebagai Authorization
          case "$SUPABASE_ANON_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_ANON_KEY");; esac
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" "${AUTH[@]}")
          echo "Status HTTP: $code"
          cat /tmp/out.json; echo
          test "$code" = "200"
